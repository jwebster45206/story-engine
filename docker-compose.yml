services:
  story-engine-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story-engine-api
    ports:
      - "8080:8080"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${CONFIG:-./config.docker.json}:/app/config.json:ro
    environment:
      - CONFIG=/app/config.json
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - story-engine-network

  story-engine-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story-engine-worker
    command: ["./worker"]  # Override CMD
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${CONFIG:-./config.docker.json}:/app/config.json:ro
    environment:
      - CONFIG=/app/config.json
      - WORKER_ID=worker-1
    depends_on:
      - redis
    networks:
      - story-engine-network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - story-engine-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOZZLE_LEVEL: "debug"
    networks:
      - story-engine-network

networks:
  story-engine-network:
    driver: bridge
